name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p result
          echo "Building amd64 binary..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X trojan/trojan.MVersion=${{ github.ref_name }}" -o result/trojan-linux-amd64 .

          echo "Building arm64 binary..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X trojan/trojan.MVersion=${{ github.ref_name }}" -o result/trojan-linux-arm64 .

          echo "Build result files:"
          ls -lh result/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name || 'v2.0.0' }}
          name: Release ${{ github.ref_name || 'v2.0.0' }}
          draft: false
          prerelease: false
          files: |
            result/trojan-linux-amd64
            result/trojan-linux-arm64
